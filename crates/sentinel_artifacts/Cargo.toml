[package]
name = "sentinel_artifacts"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.4", features = ["v4","serde"] }
time = { version = "0.3", features = ["formatting","macros","serde"] }
serde_json = "1.0"
 


[dev-dependencies]
sha2 = "0.10"
hex = "0.4"

[lib]
name = "sentinel_artifacts"
path = "src/lib.rs"

[[bin]]
name = "schema_dump"
path = "src/bin/schema_dump.rs"

