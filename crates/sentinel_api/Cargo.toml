sentinel_capabilities = { path = "../sentinel_capabilities" }
[package]
name = "sentinel_api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sentinel_api"
path = "src/main.rs"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
sentinel_store = { path = "../sentinel_store" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "1", features = ["serde"] }

sentinel_core = { path = "../sentinel_core" }
sentinel_identity = { path = "../sentinel_identity" }
