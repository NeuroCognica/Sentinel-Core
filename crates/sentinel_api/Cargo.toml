[package]
name = "sentinel_api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sentinel_api"
path = "src/main.rs"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
sentinel_store = { path = "../sentinel_store" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
