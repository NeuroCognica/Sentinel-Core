[package]
name = "sentinel_api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sentinel_api"
path = "src/main.rs"

[dependencies]
rand = "0.8"
actix-rt = "2"
sentinel_capabilities = { path = "../sentinel_capabilities" }
actix-web = "4"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sentinel_store = { path = "../sentinel_store" }
bytes = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "1", features = ["serde"] }

sentinel_core = { path = "../sentinel_core" }
sentinel_identity = { path = "../sentinel_identity" }
sentinel_policy = { path = "../sentinel_policy" }
sentinel_artifacts = { path = "../sentinel_artifacts" }
time = { version = "0.3", features = ["macros","serde"] }


[features]
openapi = ["utoipa"]

[dependencies.utoipa]
version = "4"
optional = true

[dev-dependencies]
tempfile = "3"
