[package]
name = "sentinel_policy"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sentinel_core = { path = "../sentinel_core" }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sentinel_store = { path = "../sentinel_store" }
