[package]
name = "sentinel_cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sentinel_cli"
path = "src/main.rs"

[[bin]]
name = "sentinel"
path = "src/bin/sentinel.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
sentinel_core = { path = "../sentinel_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
