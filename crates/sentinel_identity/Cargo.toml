[package]
name = "sentinel_identity"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]

ed25519-dalek = { version = "1", features = ["serde"] }
rand = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sentinel_store = { path = "../sentinel_store" }
