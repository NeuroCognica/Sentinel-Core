[package]
name = "sentinel_store"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"


[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
digest = "0.10"
hex = "0.4"

rand = "0.8"
